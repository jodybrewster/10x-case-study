<svg viewBox="0 0 1100 330" role="img" aria-label="Registration never waits on identity: the portal accepts, a provisional person is created, resolution runs afterwards and a merge or a review item follows" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:inherit">
<defs><marker id="arrow-step" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#737373"/></marker><marker id="arrow-system" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#202427"/></marker><marker id="arrow-code" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#737373"/></marker><marker id="arrow-ext" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b97818"/></marker><marker id="arrow-risk" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c00000"/></marker><marker id="arrow-new" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#202427"/></marker></defs>
<rect x="20" y="90" width="180" height="80" rx="8" fill="#ffffff" stroke="#202427" stroke-width="2"/>
<text x="110.0" y="113.0" text-anchor="middle" dominant-baseline="middle"><tspan x="110.0" dy="0" font-size="15" font-weight="700" fill="#202427">Portal accepts</tspan><tspan x="110.0" dy="17" font-size="12.5" fill="#62686d">the registration</tspan><tspan x="110.0" dy="17" font-size="12.5" fill="#62686d">milliseconds</tspan></text>
<rect x="230" y="90" width="200" height="80" rx="8" fill="#f3f3f3" stroke="#202427" stroke-width="2"/>
<text x="330.0" y="113.0" text-anchor="middle" dominant-baseline="middle"><tspan x="330.0" dy="0" font-size="15" font-weight="700" fill="#202427">Provisional person</tspan><tspan x="330.0" dy="17" font-size="12.5" fill="#62686d">linked to this registration</tspan><tspan x="330.0" dy="17" font-size="12.5" fill="#62686d">with confidence 1.0</tspan></text>
<rect x="460" y="90" width="190" height="80" rx="8" fill="#ffffff" stroke="#202427" stroke-width="2"/>
<text x="555.0" y="113.0" text-anchor="middle" dominant-baseline="middle"><tspan x="555.0" dy="0" font-size="15" font-weight="700" fill="#202427">Kit stage: registered</tspan><tspan x="555.0" dy="17" font-size="12.5" fill="#62686d">chart and lab flow</tspan><tspan x="555.0" dy="17" font-size="12.5" fill="#62686d">continue as today</tspan></text>
<rect x="680" y="90" width="190" height="80" rx="8" fill="#f3f3f3" stroke="#202427" stroke-width="2"/>
<text x="775.0" y="113.0" text-anchor="middle" dominant-baseline="middle"><tspan x="775.0" dy="0" font-size="15" font-weight="700" fill="#202427">Resolve in the background</tspan><tspan x="775.0" dy="17" font-size="12.5" fill="#62686d">match against</tspan><tspan x="775.0" dy="17" font-size="12.5" fill="#62686d">existing people</tspan></text>
<polygon points="980,90.0 1055.0,130 980,170.0 905.0,130" fill="#ffffff" stroke="#737373" stroke-width="2" stroke-linejoin="round"/>
<text x="980" y="130.0" text-anchor="middle" dominant-baseline="middle"><tspan x="980" dy="0" font-size="13.5" font-weight="700" fill="#202427">Confident?</tspan></text>
<rect x="680" y="230" width="190" height="60" rx="8" fill="#f3f3f3" stroke="#202427" stroke-width="2"/>
<text x="775.0" y="251.5" text-anchor="middle" dominant-baseline="middle"><tspan x="775.0" dy="0" font-size="15" font-weight="700" fill="#202427">Merge provisional into</tspan><tspan x="775.0" dy="17" font-size="12.5" fill="#62686d">the person, log the event</tspan></text>
<rect x="900" y="230" width="190" height="60" rx="8" fill="#fff3dc" stroke="#b97818" stroke-width="2"/>
<text x="995.0" y="251.5" text-anchor="middle" dominant-baseline="middle"><tspan x="995.0" dy="0" font-size="15" font-weight="700" fill="#202427">Review item</tspan><tspan x="995.0" dy="17" font-size="12.5" fill="#62686d">kit keeps the provisional person</tspan></text>
<path d="M200,130.0 L230,130.0" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-step)"/>
<path d="M430,130.0 L460,130.0" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-step)"/>
<path d="M650,130.0 L680,130.0" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-step)"/>
<path d="M870,130.0 L905.0,130.0" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-step)"/>
<path d="M950.0,170.0 L950,200 L775,200 L775.0,230" fill="none" stroke="#202427" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-system)"/>
<text x="958" y="185.0" text-anchor="start" dominant-baseline="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round"><tspan x="958" dy="0" font-size="11.5" fill="#202427" font-weight="600">yes</tspan></text>
<path d="M1010.0,170.0 L1010,200 L995,200 L995.0,230" fill="none" stroke="#b97818" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ext)"/>
<text x="1018" y="185.0" text-anchor="start" dominant-baseline="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round"><tspan x="1018" dy="0" font-size="11.5" fill="#94550b" font-weight="600">no</tspan></text>
<path d="M110.0,90 L110,40 L575,40 L555.0,90" fill="none" stroke="#202427" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/>
<text x="340" y="30.0" text-anchor="middle" dominant-baseline="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round"><tspan x="340" dy="0" font-size="11.5" fill="#202427" font-weight="600">nothing on this path calls the CRM</tspan></text>
</svg>
