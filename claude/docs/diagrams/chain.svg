<svg viewBox="0 0 1000 900" role="img" aria-label="The six symptoms as one causal chain from the June hotfix, plus the separate merge path for consent" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:inherit">
<defs><marker id="arrow-step" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#737373"/></marker><marker id="arrow-system" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#202427"/></marker><marker id="arrow-code" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#737373"/></marker><marker id="arrow-ext" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b97818"/></marker><marker id="arrow-risk" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c00000"/></marker><marker id="arrow-new" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#202427"/></marker></defs>
<rect x="40" y="20" width="220" height="60" rx="8" fill="#ffffff" stroke="#737373" stroke-width="2"/>
<text x="150.0" y="33.0" text-anchor="middle" dominant-baseline="middle"><tspan x="150.0" dy="0" font-size="15" font-weight="700" fill="#202427">June hotfix</tspan><tspan x="150.0" dy="17" font-size="12.5" fill="#62686d">match on surname and zip</tspan><tspan x="150.0" dy="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#62686d">order_sync.py:20-24</tspan></text>
<rect x="40" y="130" width="220" height="60" rx="8" fill="#fbeaea" stroke="#c00000" stroke-width="2"/>
<text x="150.0" y="143.0" text-anchor="middle" dominant-baseline="middle"><tspan x="150.0" dy="0" font-size="15" font-weight="700" fill="#202427">Symptom 1</tspan><tspan x="150.0" dy="17" font-size="12.5" fill="#62686d">Purchase lands on</tspan><tspan x="150.0" dy="17" font-size="12.5" fill="#62686d">a relative&#x27;s account</tspan></text>
<rect x="40" y="240" width="220" height="60" rx="8" fill="#ffffff" stroke="#737373" stroke-width="2"/>
<text x="150.0" y="253.0" text-anchor="middle" dominant-baseline="middle"><tspan x="150.0" dy="0" font-size="15" font-weight="700" fill="#202427">Every order overwrites</tspan><tspan x="150.0" dy="17" font-size="12.5" fill="#62686d">the account&#x27;s email</tspan><tspan x="150.0" dy="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#62686d">order_sync.py:42</tspan></text>
<rect x="40" y="350" width="220" height="50" rx="8" fill="#fbeaea" stroke="#c00000" stroke-width="2"/>
<text x="150.0" y="366.5" text-anchor="middle" dominant-baseline="middle"><tspan x="150.0" dy="0" font-size="15" font-weight="700" fill="#202427">Symptom 2</tspan><tspan x="150.0" dy="17" font-size="12.5" fill="#62686d">CRM emails change</tspan></text>
<rect x="40" y="450" width="220" height="60" rx="8" fill="#ffffff" stroke="#737373" stroke-width="2"/>
<text x="150.0" y="463.0" text-anchor="middle" dominant-baseline="middle"><tspan x="150.0" dy="0" font-size="15" font-weight="700" fill="#202427">Registration looks up</tspan><tspan x="150.0" dy="17" font-size="12.5" fill="#62686d">by email only</tspan><tspan x="150.0" dy="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#62686d">register.py:28</tspan></text>
<rect x="40" y="580" width="220" height="60" rx="8" fill="#fbeaea" stroke="#c00000" stroke-width="2"/>
<text x="150.0" y="593.0" text-anchor="middle" dominant-baseline="middle"><tspan x="150.0" dy="0" font-size="15" font-weight="700" fill="#202427">Symptom 3</tspan><tspan x="150.0" dy="17" font-size="12.5" fill="#62686d">Duplicate rule rejects</tspan><tspan x="150.0" dy="17" font-size="12.5" fill="#62686d">the new account</tspan></text>
<rect x="310" y="580" width="190" height="50" rx="8" fill="#ffffff" stroke="#737373" stroke-width="2"/>
<text x="405.0" y="596.5" text-anchor="middle" dominant-baseline="middle"><tspan x="405.0" dy="0" font-size="15" font-weight="700" fill="#202427">Identity conflict</tspan><tspan x="405.0" dy="17" font-size="12.5" fill="#62686d">same email, other birthdate</tspan></text>
<rect x="540" y="450" width="200" height="50" rx="8" fill="#ffffff" stroke="#737373" stroke-width="2"/>
<text x="640.0" y="475.0" text-anchor="middle" dominant-baseline="middle"><tspan x="640.0" dy="0" font-size="15" font-weight="700" fill="#202427">Gift recipient registers</tspan></text>
<rect x="540" y="540" width="200" height="60" rx="8" fill="#ffffff" stroke="#737373" stroke-width="2"/>
<text x="640.0" y="553.0" text-anchor="middle" dominant-baseline="middle"><tspan x="640.0" dy="0" font-size="15" font-weight="700" fill="#202427">Recipient&#x27;s account has</tspan><tspan x="640.0" dy="17" font-size="12.5" fill="#62686d">an inactive owner</tspan><tspan x="640.0" dy="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#62686d">client.py:59-60</tspan></text>
<rect x="540" y="650" width="200" height="60" rx="8" fill="#fbeaea" stroke="#c00000" stroke-width="2"/>
<text x="640.0" y="663.0" text-anchor="middle" dominant-baseline="middle"><tspan x="640.0" dy="0" font-size="15" font-weight="700" fill="#202427">Symptom 4</tspan><tspan x="640.0" dy="17" font-size="12.5" fill="#62686d">Gift registration fails,</tspan><tspan x="640.0" dy="17" font-size="12.5" fill="#62686d">purchase cannot move</tspan></text>
<rect x="310" y="700" width="200" height="56" rx="8" fill="#ffffff" stroke="#737373" stroke-width="2"/>
<text x="410.0" y="719.5" text-anchor="middle" dominant-baseline="middle"><tspan x="410.0" dy="0" font-size="15" font-weight="700" fill="#202427">CRM holds no registration</tspan><tspan x="410.0" dy="17" font-size="12.5" fill="#62686d">for the kit</tspan></text>
<rect x="790" y="450" width="200" height="56" rx="8" fill="#ffffff" stroke="#737373" stroke-width="2"/>
<text x="890.0" y="469.5" text-anchor="middle" dominant-baseline="middle"><tspan x="890.0" dy="0" font-size="15" font-weight="700" fill="#202427">Purchase and registration</tspan><tspan x="890.0" dy="17" font-size="12.5" fill="#62686d">on different accounts</tspan></text>
<rect x="310" y="810" width="200" height="60" rx="8" fill="#fbeaea" stroke="#c00000" stroke-width="2"/>
<text x="410.0" y="823.0" text-anchor="middle" dominant-baseline="middle"><tspan x="410.0" dy="0" font-size="15" font-weight="700" fill="#202427">Symptom 5</tspan><tspan x="410.0" dy="17" font-size="12.5" fill="#62686d">Register your kit</tspan><tspan x="410.0" dy="17" font-size="12.5" fill="#62686d">sent after results</tspan></text>
<rect x="790" y="20" width="190" height="50" rx="8" fill="#ffffff" stroke="#737373" stroke-width="2"/>
<text x="885.0" y="45.0" text-anchor="middle" dominant-baseline="middle"><tspan x="885.0" dy="0" font-size="15" font-weight="700" fill="#202427">Duplicate accounts</tspan></text>
<rect x="790" y="130" width="190" height="70" rx="8" fill="#ffffff" stroke="#737373" stroke-width="2"/>
<text x="885.0" y="148.0" text-anchor="middle" dominant-baseline="middle"><tspan x="885.0" dy="0" font-size="15" font-weight="700" fill="#202427">Merge keeps only the</tspan><tspan x="885.0" dy="17" font-size="12.5" fill="#62686d">survivor&#x27;s consent flags</tspan><tspan x="885.0" dy="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#62686d">merge.py:3-4</tspan></text>
<rect x="790" y="260" width="190" height="50" rx="8" fill="#fbeaea" stroke="#c00000" stroke-width="2"/>
<text x="885.0" y="276.5" text-anchor="middle" dominant-baseline="middle"><tspan x="885.0" dy="0" font-size="15" font-weight="700" fill="#202427">Symptom 6</tspan><tspan x="885.0" dy="17" font-size="12.5" fill="#62686d">Opt-outs lost</tspan></text>
