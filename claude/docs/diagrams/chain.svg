<text x="102.0" y="545.0" text-anchor="end" dominant-baseline="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round"><tspan x="102.0" dy="0" font-size="11.5" fill="#62686d" font-weight="600">finds nobody</tspan></text>
