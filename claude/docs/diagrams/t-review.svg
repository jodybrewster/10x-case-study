<svg viewBox="0 0 1100 400" role="img" aria-label="Review item lifecycle: open, claimed, decided, applied and closed, with side paths for a lapsed claim, escalation, an item superseded by new evidence and a decision that fails to apply" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:inherit">
<defs><marker id="arrow-step" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#737373"/></marker><marker id="arrow-system" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#202427"/></marker><marker id="arrow-code" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#737373"/></marker><marker id="arrow-ext" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b97818"/></marker><marker id="arrow-risk" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c00000"/></marker><marker id="arrow-new" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#202427"/></marker></defs>
<rect x="20" y="150" width="150" height="70" rx="8" fill="#f3f3f3" stroke="#202427" stroke-width="2"/>
<text x="95.0" y="168.0" text-anchor="middle" dominant-baseline="middle"><tspan x="95.0" dy="0" font-size="15" font-weight="700" fill="#202427">Open</tspan><tspan x="95.0" dy="17" font-size="12.5" fill="#62686d">queued with score</tspan><tspan x="95.0" dy="17" font-size="12.5" fill="#62686d">and reason codes</tspan></text>
<rect x="235" y="150" width="150" height="70" rx="8" fill="#f3f3f3" stroke="#202427" stroke-width="2"/>
<text x="310.0" y="168.0" text-anchor="middle" dominant-baseline="middle"><tspan x="310.0" dy="0" font-size="15" font-weight="700" fill="#202427">Claimed</tspan><tspan x="310.0" dy="17" font-size="12.5" fill="#62686d">one reviewer,</tspan><tspan x="310.0" dy="17" font-size="12.5" fill="#62686d">30-minute lease</tspan></text>
<rect x="450" y="150" width="160" height="70" rx="8" fill="#f3f3f3" stroke="#202427" stroke-width="2"/>
<text x="530.0" y="168.0" text-anchor="middle" dominant-baseline="middle"><tspan x="530.0" dy="0" font-size="15" font-weight="700" fill="#202427">Decided</tspan><tspan x="530.0" dy="17" font-size="12.5" fill="#62686d">same, different</tspan><tspan x="530.0" dy="17" font-size="12.5" fill="#62686d">or cannot tell</tspan></text>
<rect x="675" y="150" width="160" height="70" rx="8" fill="#f3f3f3" stroke="#202427" stroke-width="2"/>
<text x="755.0" y="168.0" text-anchor="middle" dominant-baseline="middle"><tspan x="755.0" dy="0" font-size="15" font-weight="700" fill="#202427">Applying</tspan><tspan x="755.0" dy="17" font-size="12.5" fill="#62686d">re-check evidence,</tspan><tspan x="755.0" dy="17" font-size="12.5" fill="#62686d">merge or keep apart</tspan></text>
<rect x="900" y="150" width="180" height="70" rx="8" fill="#ffffff" stroke="#202427" stroke-width="2"/>
<text x="990.0" y="168.0" text-anchor="middle" dominant-baseline="middle"><tspan x="990.0" dy="0" font-size="15" font-weight="700" fill="#202427">Closed</tspan><tspan x="990.0" dy="17" font-size="12.5" fill="#62686d">event logged, consumers</tspan><tspan x="990.0" dy="17" font-size="12.5" fill="#62686d">notified, label stored</tspan></text>
<rect x="450" y="30" width="160" height="60" rx="8" fill="#fff3dc" stroke="#b97818" stroke-width="2"/>
<text x="530.0" y="43.0" text-anchor="middle" dominant-baseline="middle"><tspan x="530.0" dy="0" font-size="15" font-weight="700" fill="#202427">Escalated</tspan><tspan x="530.0" dy="17" font-size="12.5" fill="#62686d">second reviewer or</tspan><tspan x="530.0" dy="17" font-size="12.5" fill="#62686d">clinical operations</tspan></text>
<rect x="40" y="290" width="190" height="64" rx="8" fill="#ffffff" stroke="#737373" stroke-width="2"/>
<text x="135.0" y="305.0" text-anchor="middle" dominant-baseline="middle"><tspan x="135.0" dy="0" font-size="15" font-weight="700" fill="#202427">Superseded</tspan><tspan x="135.0" dy="17" font-size="12.5" fill="#62686d">evidence changed,</tspan><tspan x="135.0" dy="17" font-size="12.5" fill="#62686d">pair re-scored</tspan></text>
<rect x="675" y="300" width="160" height="64" rx="8" fill="#fbeaea" stroke="#c00000" stroke-width="2"/>
<text x="755.0" y="315.0" text-anchor="middle" dominant-baseline="middle"><tspan x="755.0" dy="0" font-size="15" font-weight="700" fill="#202427">Apply failed</tspan><tspan x="755.0" dy="17" font-size="12.5" fill="#62686d">retried, then paged</tspan><tspan x="755.0" dy="17" font-size="12.5" fill="#62686d">nothing half-applied</tspan></text>
<path d="M170,185.0 L235,185.0" fill="none" stroke="#202427" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-new)"/>
<text x="202.5" y="175.0" text-anchor="middle" dominant-baseline="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round"><tspan x="202.5" dy="0" font-size="11.5" fill="#202427" font-weight="600">claim</tspan></text>
<path d="M385,185.0 L450,185.0" fill="none" stroke="#202427" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-new)"/>
<text x="417.5" y="175.0" text-anchor="middle" dominant-baseline="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round"><tspan x="417.5" dy="0" font-size="11.5" fill="#202427" font-weight="600">decide</tspan></text>
<path d="M610,185.0 L675,185.0" fill="none" stroke="#202427" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-new)"/>
<text x="642.5" y="175.0" text-anchor="middle" dominant-baseline="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round"><tspan x="642.5" dy="0" font-size="11.5" fill="#202427" font-weight="600">same or different</tspan></text>
<path d="M835,185.0 L900,185.0" fill="none" stroke="#202427" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-system)"/>
<text x="867.5" y="175.0" text-anchor="middle" dominant-baseline="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round"><tspan x="867.5" dy="0" font-size="11.5" fill="#202427" font-weight="600">committed</tspan></text>
<path d="M280.0,150 L280,110 L95,110 L95.0,150" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-step)"/>
<text x="190" y="100.0" text-anchor="middle" dominant-baseline="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round"><tspan x="190" dy="0" font-size="11.5" fill="#62686d" font-weight="600">lease lapses</tspan></text>
<path d="M530.0,150 L530.0,90" fill="none" stroke="#b97818" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#arrow-ext)"/>
<text x="540.0" y="103.0" text-anchor="start" dominant-baseline="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round"><tspan x="540.0" dy="0" font-size="11.5" fill="#94550b" font-weight="600">cannot tell, chart pair</tspan><tspan x="540.0" dy="17" font-size="11.5" fill="#94550b" font-weight="600">or high-risk merge</tspan></text>
<path d="M610,60.0 L755,60 L755.0,150" fill="none" stroke="#b97818" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#arrow-ext)"/>
<text x="690" y="50.0" text-anchor="middle" dominant-baseline="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round"><tspan x="690" dy="0" font-size="11.5" fill="#94550b" font-weight="600">second decision</tspan></text>
<path d="M115.0,220 L135.0,290" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-step)"/>
<text x="135.0" y="255.0" text-anchor="start" dominant-baseline="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round"><tspan x="135.0" dy="0" font-size="11.5" fill="#62686d" font-weight="600">new record or link</tspan></text>
<path d="M715.0,220 L715,260 L140,260 L160.0,290" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-step)"/>
<text x="430" y="250.0" text-anchor="middle" dominant-baseline="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round"><tspan x="430" dy="0" font-size="11.5" fill="#62686d" font-weight="600">evidence no longer matches the decision</tspan></text>
<path d="M775.0,220 L775.0,300" fill="none" stroke="#c00000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-risk)"/>
<text x="783.0" y="260.0" text-anchor="start" dominant-baseline="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round"><tspan x="783.0" dy="0" font-size="11.5" fill="#980000" font-weight="600">error</tspan></text>
<path d="M95.0,354 L75,385 L8,385 L8,185 L20,185.0" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-step)"/>
<text x="90" y="385.0" text-anchor="start" dominant-baseline="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round"><tspan x="90" dy="0" font-size="11.5" fill="#62686d" font-weight="600">re-queued, or closed as moot</tspan></text>
</svg>
