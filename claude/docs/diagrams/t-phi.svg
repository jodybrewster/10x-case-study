<text x="320" y="93.0" text-anchor="middle" dominant-baseline="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round"><tspan x="320" dy="0" font-size="11.5" fill="#202427" font-weight="600">registration: name, email,</tspan><tspan x="320" dy="17" font-size="11.5" fill="#202427" font-weight="600">phone, birthdate, kit barcode</tspan></text>
