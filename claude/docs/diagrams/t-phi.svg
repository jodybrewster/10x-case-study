<svg viewBox="0 0 1100 420" role="img" aria-label="Protected health information: the clinical zone and the identity store sit inside the boundary; the commercial zone receives the person key, contact details and consent, never results or test names" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:inherit">
