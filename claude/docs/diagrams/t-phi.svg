<path d="M680,215.0 L760,215 L760,243 L850,243.0" fill="none" stroke="#202427" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-new)"/>
<text x="760" y="273.0" text-anchor="middle" dominant-baseline="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round"><tspan x="760" dy="0" font-size="11.5" fill="#202427" font-weight="600">person_key, kit stage,</tspan><tspan x="760" dy="17" font-size="11.5" fill="#202427" font-weight="600">channel consent</tspan></text>
<path d="M850,348.0 L760,348 L760,330 L680,330.0" fill="none" stroke="#202427" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-new)"/>
<text x="760" y="363.0" text-anchor="middle" dominant-baseline="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round"><tspan x="760" dy="0" font-size="11.5" fill="#202427" font-weight="600">order event in,</tspan><tspan x="760" dy="17" font-size="11.5" fill="#202427" font-weight="600">person_key back</tspan></text>
<path d="M550.0,260 L550.0,300" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
