<text x="550.0" y="316.5" text-anchor="middle" dominant-baseline="middle"><tspan x="550.0" dy="0" font-size="15" font-weight="700" fill="#202427">Hashed match keys for blocking</tspan><tspan x="550.0" dy="17" font-size="12.5" fill="#62686d">outside the boundary</tspan></text>
