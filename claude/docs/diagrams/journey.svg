<svg viewBox="0 0 1140 440" role="img" aria-label="Customer journey: buy, CRM copy, ship, register, chart, sample, result, view, with the marketing messages each stage triggers" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:inherit">
<defs><marker id="arrow-step" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#737373"/></marker><marker id="arrow-system" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#202427"/></marker><marker id="arrow-code" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#737373"/></marker><marker id="arrow-ext" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b97818"/></marker><marker id="arrow-risk" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c00000"/></marker><marker id="arrow-new" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#202427"/></marker></defs>
<rect x="20" y="100" width="160" height="96" rx="8" fill="#ffffff" stroke="#202427" stroke-width="2"/>
<text x="100.0" y="122.5" text-anchor="middle" dominant-baseline="middle"><tspan x="100.0" dy="0" font-size="15" font-weight="700" fill="#202427">Buy online</tspan><tspan x="100.0" dy="17" font-size="12.5" fill="#62686d">e-commerce checkout</tspan><tspan x="100.0" dy="17" font-size="12.5" fill="#62686d">gives email, name,</tspan><tspan x="100.0" dy="17" font-size="12.5" fill="#62686d">phone, address</tspan></text>
<rect x="210" y="100" width="160" height="96" rx="8" fill="#f3f3f3" stroke="#737373" stroke-width="2"/>
<text x="290.0" y="131.0" text-anchor="middle" dominant-baseline="middle"><tspan x="290.0" dy="0" font-size="15" font-weight="700" fill="#202427">Order copied to CRM</tspan><tspan x="290.0" dy="17" font-size="12.5" fill="#62686d">about 30 minutes later</tspan><tspan x="290.0" dy="17" font-size="12.5" fill="#62686d">account found or created</tspan></text>
<rect x="400" y="100" width="160" height="96" rx="8" fill="#ffffff" stroke="#202427" stroke-width="2"/>
<text x="480.0" y="131.0" text-anchor="middle" dominant-baseline="middle"><tspan x="480.0" dy="0" font-size="15" font-weight="700" fill="#202427">Kit ships</tspan><tspan x="480.0" dy="17" font-size="12.5" fill="#62686d">with a barcode</tspan><tspan x="480.0" dy="17" font-size="12.5" fill="#62686d">delivered after 4 days</tspan></text>
<rect x="590" y="100" width="160" height="96" rx="8" fill="#ffffff" stroke="#202427" stroke-width="2"/>
<text x="670.0" y="114.0" text-anchor="middle" dominant-baseline="middle"><tspan x="670.0" dy="0" font-size="15" font-weight="700" fill="#202427">Register the kit</tspan><tspan x="670.0" dy="17" font-size="12.5" fill="#62686d">member portal,</tspan><tspan x="670.0" dy="17" font-size="12.5" fill="#62686d">1 day after delivery</tspan><tspan x="670.0" dy="17" font-size="12.5" fill="#62686d">gives email, name,</tspan><tspan x="670.0" dy="17" font-size="12.5" fill="#62686d">birthdate, phone</tspan></text>
<rect x="780" y="100" width="160" height="96" rx="8" fill="#fff3dc" stroke="#b97818" stroke-width="2"/>
<text x="860.0" y="139.5" text-anchor="middle" dominant-baseline="middle"><tspan x="860.0" dy="0" font-size="15" font-weight="700" fill="#202427">Mail the sample</tspan><tspan x="860.0" dy="17" font-size="12.5" fill="#62686d">to the lab</tspan></text>
<rect x="970" y="100" width="160" height="96" rx="8" fill="#fff3dc" stroke="#b97818" stroke-width="2"/>
<text x="1050.0" y="122.5" text-anchor="middle" dominant-baseline="middle"><tspan x="1050.0" dy="0" font-size="15" font-weight="700" fill="#202427">Result filed</tspan><tspan x="1050.0" dy="17" font-size="12.5" fill="#62686d">to the chart, 11 days</tspan><tspan x="1050.0" dy="17" font-size="12.5" fill="#62686d">after registration,</tspan><tspan x="1050.0" dy="17" font-size="12.5" fill="#62686d">linked by kit barcode</tspan></text>
<rect x="210" y="250" width="160" height="50" rx="8" fill="#fbeaea" stroke="#c00000" stroke-width="2" stroke-dasharray="6 5"/>
<text x="290.0" y="266.5" text-anchor="middle" dominant-baseline="middle"><tspan x="290.0" dy="0" font-size="15" font-weight="700" fill="#202427">Message</tspan><tspan x="290.0" dy="17" font-size="12.5" fill="#62686d">please register your kit</tspan></text>
<rect x="575" y="250" width="190" height="84" rx="8" fill="#fbeaea" stroke="#c00000" stroke-width="2"/>
<text x="670.0" y="266.5" text-anchor="middle" dominant-baseline="middle"><tspan x="670.0" dy="0" font-size="15" font-weight="700" fill="#202427">Registration to CRM</tspan><tspan x="670.0" dy="17" font-size="12.5" fill="#62686d">account found by email,</tspan><tspan x="670.0" dy="17" font-size="12.5" fill="#62686d">or created</tspan><tspan x="670.0" dy="17" font-size="12.5" fill="#62686d">the portal waits for the answer</tspan></text>
<rect x="590" y="370" width="160" height="44" rx="8" fill="#fff3dc" stroke="#b97818" stroke-width="2" stroke-dasharray="6 5"/>
<text x="670.0" y="383.5" text-anchor="middle" dominant-baseline="middle"><tspan x="670.0" dy="0" font-size="15" font-weight="700" fill="#202427">Message</tspan><tspan x="670.0" dy="17" font-size="12.5" fill="#62686d">registered</tspan></text>
<rect x="780" y="250" width="160" height="60" rx="8" fill="#fff3dc" stroke="#b97818" stroke-width="2"/>
<text x="860.0" y="271.5" text-anchor="middle" dominant-baseline="middle"><tspan x="860.0" dy="0" font-size="15" font-weight="700" fill="#202427">Chart created in EHR</tspan><tspan x="860.0" dy="17" font-size="12.5" fill="#62686d">from name and birthdate</tspan></text>
<rect x="970" y="250" width="160" height="50" rx="8" fill="#ffffff" stroke="#202427" stroke-width="2"/>
<text x="1050.0" y="266.5" text-anchor="middle" dominant-baseline="middle"><tspan x="1050.0" dy="0" font-size="15" font-weight="700" fill="#202427">View results</tspan><tspan x="1050.0" dy="17" font-size="12.5" fill="#62686d">member portal</tspan></text>
<rect x="970" y="370" width="160" height="44" rx="8" fill="#fff3dc" stroke="#b97818" stroke-width="2" stroke-dasharray="6 5"/>
<text x="1050.0" y="383.5" text-anchor="middle" dominant-baseline="middle"><tspan x="1050.0" dy="0" font-size="15" font-weight="700" fill="#202427">Message</tspan><tspan x="1050.0" dy="17" font-size="12.5" fill="#62686d">results ready</tspan></text>
<path d="M180,148.0 L210,148.0" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-step)"/>
<path d="M370,148.0 L400,148.0" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-step)"/>
<path d="M560,148.0 L590,148.0" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-step)"/>
<path d="M750,148.0 L780,148.0" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-step)"/>
<path d="M940,148.0 L970,148.0" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-step)"/>
<path d="M290.0,196 L290.0,250" fill="none" stroke="#c00000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#arrow-risk)"/>
<path d="M670.0,196 L670.0,250" fill="none" stroke="#737373" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-code)"/>
<path d="M670.0,334 L670.0,370" fill="none" stroke="#b97818" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#arrow-ext)"/>
<path d="M730.0,196 L730,222 L860,222 L860.0,250" fill="none" stroke="#b97818" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#arrow-ext)"/>
<path d="M1050.0,196 L1050.0,250" fill="none" stroke="#b97818" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#arrow-ext)"/>
<path d="M1050.0,300 L1050.0,370" fill="none" stroke="#b97818" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#arrow-ext)"/>
<path d="M100.0,100 L100,60 L1050,60 L1050.0,100" fill="none" stroke="#202427" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/>
<text x="575" y="50.0" text-anchor="middle" dominant-baseline="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round"><tspan x="575" dy="0" font-size="11.5" fill="#202427" font-weight="600">the kit barcode travels the whole way</tspan></text>
</svg>
