<svg viewBox="0 0 1100 420" role="img" aria-label="Matching pipeline: normalise, link deterministically, generate candidate pairs, score, split by threshold into automatic links, a review queue and no link, then cluster under constraints" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;display:block;margin:0 auto;font-family:inherit">
<defs><marker id="arrow-step" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#737373"/></marker><marker id="arrow-system" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#202427"/></marker><marker id="arrow-code" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#737373"/></marker><marker id="arrow-ext" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b97818"/></marker><marker id="arrow-risk" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c00000"/></marker><marker id="arrow-new" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#202427"/></marker></defs>
<rect x="20" y="50" width="170" height="90" rx="8" fill="#ffffff" stroke="#737373" stroke-width="2"/>
<text x="105.0" y="69.5" text-anchor="middle" dominant-baseline="middle"><tspan x="105.0" dy="0" font-size="15" font-weight="700" fill="#202427">Normalise</tspan><tspan x="105.0" dy="17" font-size="12.5" fill="#62686d">emails, phones, names</tspan><tspan x="105.0" dy="17" font-size="12.5" fill="#62686d">with a nickname table,</tspan><tspan x="105.0" dy="17" font-size="12.5" fill="#62686d">dates, addresses</tspan></text>
<rect x="215" y="50" width="170" height="90" rx="8" fill="#ffffff" stroke="#202427" stroke-width="2"/>
<text x="300.0" y="69.5" text-anchor="middle" dominant-baseline="middle"><tspan x="300.0" dy="0" font-size="15" font-weight="700" fill="#202427">Deterministic links</tspan><tspan x="300.0" dy="17" font-size="12.5" fill="#62686d">kit barcode chain,</tspan><tspan x="300.0" dy="17" font-size="12.5" fill="#62686d">order to opportunity</tspan><tspan x="300.0" dy="17" font-size="12.5" fill="#62686d">confidence 1.0</tspan></text>
<rect x="410" y="50" width="170" height="90" rx="8" fill="#ffffff" stroke="#737373" stroke-width="2"/>
<text x="495.0" y="69.5" text-anchor="middle" dominant-baseline="middle"><tspan x="495.0" dy="0" font-size="15" font-weight="700" fill="#202427">Candidate pairs</tspan><tspan x="495.0" dy="17" font-size="12.5" fill="#62686d">share an email, a phone,</tspan><tspan x="495.0" dy="17" font-size="12.5" fill="#62686d">surname and zip,</tspan><tspan x="495.0" dy="17" font-size="12.5" fill="#62686d">or surname and birthdate</tspan></text>
<rect x="605" y="50" width="180" height="90" rx="8" fill="#f3f3f3" stroke="#202427" stroke-width="2"/>
<text x="695.0" y="69.5" text-anchor="middle" dominant-baseline="middle"><tspan x="695.0" dy="0" font-size="15" font-weight="700" fill="#202427">Score the pair</tspan><tspan x="695.0" dy="17" font-size="12.5" fill="#62686d">agree and disagree weights</tspan><tspan x="695.0" dy="17" font-size="12.5" fill="#62686d">birthdate conflict is a veto</tspan><tspan x="695.0" dy="17" font-size="12.5" fill="#62686d">household is not identity</tspan></text>
<polygon points="880,55.0 955.0,95 880,135.0 805.0,95" fill="#ffffff" stroke="#737373" stroke-width="2" stroke-linejoin="round"/>
<text x="880" y="95.0" text-anchor="middle" dominant-baseline="middle"><tspan x="880" dy="0" font-size="13.5" font-weight="700" fill="#202427">Score?</tspan></text>
<rect x="920" y="250" width="170" height="56" rx="8" fill="#ffffff" stroke="#202427" stroke-width="2"/>
<text x="1005.0" y="269.5" text-anchor="middle" dominant-baseline="middle"><tspan x="1005.0" dy="0" font-size="15" font-weight="700" fill="#202427">0.90 and above</tspan><tspan x="1005.0" dy="17" font-size="12.5" fill="#62686d">link automatically</tspan></text>
<rect x="640" y="260" width="190" height="56" rx="8" fill="#fff3dc" stroke="#b97818" stroke-width="2"/>
<text x="735.0" y="279.5" text-anchor="middle" dominant-baseline="middle"><tspan x="735.0" dy="0" font-size="15" font-weight="700" fill="#202427">0.60 to 0.90</tspan><tspan x="735.0" dy="17" font-size="12.5" fill="#62686d">review queue, with reasons</tspan></text>
<rect x="420" y="260" width="170" height="56" rx="8" fill="#ffffff" stroke="#737373" stroke-width="2"/>
<text x="505.0" y="279.5" text-anchor="middle" dominant-baseline="middle"><tspan x="505.0" dy="0" font-size="15" font-weight="700" fill="#202427">below 0.60</tspan><tspan x="505.0" dy="17" font-size="12.5" fill="#62686d">no link</tspan></text>
<rect x="640" y="340" width="250" height="70" rx="8" fill="#f3f3f3" stroke="#202427" stroke-width="2"/>
<text x="765.0" y="358.0" text-anchor="middle" dominant-baseline="middle"><tspan x="765.0" dy="0" font-size="15" font-weight="700" fill="#202427">Constrained clustering</tspan><tspan x="765.0" dy="17" font-size="12.5" fill="#62686d">no cluster with two birthdates,</tspan><tspan x="765.0" dy="17" font-size="12.5" fill="#62686d">EHR charts never merged by code</tspan></text>
<rect x="20" y="340" width="340" height="70" rx="8" fill="#ffffff" stroke="#202427" stroke-width="2"/>
<text x="190.0" y="358.0" text-anchor="middle" dominant-baseline="middle"><tspan x="190.0" dy="0" font-size="15" font-weight="700" fill="#202427">Outputs</tspan><tspan x="190.0" dy="17" font-size="12.5" fill="#62686d">person_key and confidence per record,</tspan><tspan x="190.0" dy="17" font-size="12.5" fill="#62686d">review items, event log entries</tspan></text>
<path d="M190,95.0 L215,95.0" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-step)"/>
<path d="M385,95.0 L410,95.0" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-step)"/>
<path d="M580,95.0 L605,95.0" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-step)"/>
<path d="M785,95.0 L805.0,95.0" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-step)"/>
<path d="M955.0,95.0 L1005,165 L1005.0,250" fill="none" stroke="#202427" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-system)"/>
<path d="M880.0,135.0 L880,235 L735,235 L735.0,260" fill="none" stroke="#b97818" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ext)"/>
<path d="M880,235 L505,235 L505.0,260" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-step)"/>
<text x="600" y="225.0" text-anchor="middle" dominant-baseline="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round"><tspan x="600" dy="0" font-size="11.5" fill="#62686d" font-weight="600">no link</tspan></text>
<path d="M1005.0,306 L1005,375 L890,375.0" fill="none" stroke="#202427" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-system)"/>
<text x="1013" y="340.0" text-anchor="start" dominant-baseline="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round"><tspan x="1013" dy="0" font-size="11.5" fill="#202427" font-weight="600">accepted links</tspan></text>
<path d="M735.0,316 L735.0,340" fill="none" stroke="#b97818" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#arrow-ext)"/>
<text x="743.0" y="328.0" text-anchor="start" dominant-baseline="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round"><tspan x="743.0" dy="0" font-size="11.5" fill="#94550b" font-weight="600">human yes or no</tspan></text>
<path d="M640,375.0 L360,375.0" fill="none" stroke="#737373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-step)"/>
</svg>
